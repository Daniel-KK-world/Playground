<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <style>
        /* --- 1. General Reset & Typography --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        /* --- 2. Background Image & Overlay --- */
        .hero-container {
            position: relative;
            height: 100vh;
            min-height: 700px;
            width: 100%;
            /* Using a placeholder image that resembles a movie grid */
            background-image: url('https://assets.nflxext.com/ffe/siteui/vlv3/c906271d-7184-4eec-83c9-b6d432a847d0/web/US-en-20231127-TRIFECTA-perspective_alpha_website_large.jpg');
            background-size: cover;
            background-position: center;
        }

        /* The dark gradient overlay to make text readable */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            background-image: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.8) 0,
                rgba(0, 0, 0, 0) 60%,
                rgba(0, 0, 0, 0.8) 100%
            );
            border-bottom: 8px solid #232323; /* Dark grey border at very bottom */
        }

        /* --- 3. Navigation Bar --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 50px;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 40px; /* Text fallback for logo */
            font-weight: bold;
            color: #E50914;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .signin-btn {
            background-color: #E50914;
            color: white;
            padding: 7px 17px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 4px;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .signin-btn:hover {
            background-color: #c11119;
        }

        /* --- 4. Main Hero Content --- */
        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            padding: 0 20px;
            margin-top: -50px; /* Slight offset to center visually */
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            max-width: 640px;
            margin-bottom: 1rem;
        }

        .sub-text-1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1rem;
        }

        .sub-text-2 {
            font-size: 1.25rem;
            font-weight: 400;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* --- 5. Email Form Section --- */
        .email-form {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
            gap: 8px; /* Space between input and button */
        }

        .email-input-container {
            position: relative;
            flex-grow: 1;
        }

        .email-input {
            width: 100%;
            height: 56px;
            padding: 20px 16px 5px; /* Top padding for floating label effect */
            background: rgba(22, 22, 22, 0.7);
            border: 1px solid rgba(128, 128, 128, 0.7);
            border-radius: 4px;
            color: white;
            font-size: 16px;
        }
        
        /* Placeholder styling to look like the UI */
        .email-input::placeholder {
            color: #bfbfbf;
        }

        .get-started-btn {
            height: 56px;
            background-color: #E50914;
            color: white;
            font-size: 24px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            padding: 0 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .get-started-btn:hover {
            background-color: #c11119;
        }

        .arrow-icon {
            margin-left: 10px;
            font-size: 18px;
        }

        /* --- 6. The Curved Bottom Divider Effect --- */
        /* This creates the curved graphic at the bottom of the hero */
        .curve-container {
            position: absolute;
            bottom: -2px; /* Pull it down slightly to cover gaps */
            left: 0;
            right: 0;
            height: 100px;
            overflow: hidden;
            z-index: 5;
            pointer-events: none;
        }

        .curve {
            width: 150%; 
            height: 100%;
            border-top-left-radius: 50% 100%;
            border-top-right-radius: 50% 100%;
            background: radial-gradient(50% 500% at 50% -420%, rgba(64,97,231,0) 50%, rgba(0,0,0,0.8) 100%), black;
            /* In simpler terms: This mimics the dark curved gradient bar */
            position: absolute;
            bottom: 0;
            left: -25%;
            background-color: transparent;
            box-shadow: 0px -4px 10px rgba(0,0,0,1);
            border: 4px solid #F00; /* Just for visualization if needed, removing for production look */
            border: none;
        }

        /* Specialized Curve using SVG or CSS Tricks usually. 
           Here is a CSS trick using a pseudo element for the red curve line seen in some versions,
           or the dark curve seen in your screenshot. */
        .curve-decoration {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 4rem;
            background: linear-gradient(to top, #000, transparent);
        }
        
        /* Responsive Tweaks */
        @media (max-width: 740px) {
            h1 { font-size: 2rem; }
            .email-form { flex-direction: column; }
            .email-input { width: 100%; }
            .get-started-btn { width: 100%; margin-top: 10px; justify-content: center; }
            header { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <div class="hero-overlay"></div>

        <header>
            <a href="#" class="logo">NETFLIX</a>
            <button class="signin-btn">Sign In</button>
        </header>

        <div class="hero-content">
            <h1>Unlimited movies, TV shows, and more</h1>
            <p class="sub-text-1">Starts at US$2.99. Cancel anytime.</p>
            <p class="sub-text-2">Ready to watch? Enter your email to create or restart your membership.</p>
            
            <div class="email-form">
                <div class="email-input-container">
                    <input type="email" class="email-input" placeholder="Email address">
                </div>
                <button class="get-started-btn">
                    Get Started <span class="arrow-icon">></span>
                </button>
            </div>
        </div>

        <div class="curve-container">
             <div style="
                width: 120%;
                height: 100px;
                border-top-left-radius: 50% 100%;
                border-top-right-radius: 50% 100%;
                background: linear-gradient(to right, #000000 0%, #330c11 50%, #000000 100%);
                position: absolute;
                bottom: -50px;
                left: -10%;
                z-index: 2;
                border-top: 2px solid #6d1e26;
                box-shadow: 0px -20px 60px -10px #000;
             "></div>
        </div>
    </div>

</body>
</html>
